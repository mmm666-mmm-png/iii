# 人行道两轮车检测数据集配置
# ------------------------------------------------------------------
# 把标注好的数据集按下面的目录结构放好后，运行:
#     python train.py --data data.yaml
#
# 推荐目录结构（相对本文件所在目录 yolo_train/）：
#   datasets/ebike/
#     images/train/*.jpg      # 训练图片
#     images/val/*.jpg        # 验证图片
#     labels/train/*.txt      # 每张图一个同名 txt（YOLO 格式: cls cx cy w h 归一化）
#     labels/val/*.txt
#
# 没有标注数据时，先用 auto_label.py 用 YOLOE 自动打标，再人工修正。
# ------------------------------------------------------------------
path: ../datasets/ebike   # 数据集根目录（相对 yolo_train/ 运行）
train: images/train
val: images/val

nc: 3
names:
  0: shared_ebike   # 共享电动车
  1: bicycle        # 自行车
  2: home_ebike     # 家用电动车
